{% extends "base.html" %}
{% block title %}Live — Simple Video Share{% endblock %}
{% block content %}
<h1>Live</h1>
<div class="waterfall" id="live-waterfall">
  {% for room in rooms %}
  <a class="card live-card" href="{{ url_for('live.view', room_id=room['id']) }}">
    <img class="card__cover"
         src="{{ url_for('home.cover', filename=room['cover_filename']) if room['cover_filename'] else url_for('static', filename='img/placeholder.svg') }}"
         alt="{{ room['title'] }}" loading="lazy">
    <span class="live-badge" data-url="{{ room['url'] }}">ON AIR</span>
    <div class="card__title">{{ room['title'] }}</div>
  </a>
  {% else %}
  <p class="muted">No live rooms yet.</p>
  {% endfor %}
</div>
<script>
// Live "on air" probe (§14.6): for each room, a ranged GET against the room's
// stream link (room.url), aborted right after the status arrives. A 200/206
// means someone is pushing; anything else (404, network error, CORS block on an
// external link) means off air. Same-origin /live/<code>.flv links are probed
// directly; external links may report off air when the host blocks the ranged
// request — acceptable given the media server is the source of truth.
(function () {
  'use strict';
  var badges = Array.prototype.slice.call(document.querySelectorAll('.live-badge'));
  if (!badges.length) return;

  function probe(url) {
    var ctrl = new AbortController();
    return fetch(url, {
      method: 'GET',
      headers: { Range: 'bytes=0-1' },
      signal: ctrl.signal
    }).then(function (resp) {
      ctrl.abort(); // the headers are enough; stop downloading the stream
      return resp.status === 200 || resp.status === 206;
    }).catch(function () { return false; });
  }

  function refresh() {
    badges.forEach(function (badge) {
      probe(badge.getAttribute('data-url')).then(function (onAir) {
        badge.classList.toggle('is-onair', onAir);
      });
    });
  }

  refresh();
  setInterval(refresh, 15000); // keep the badges current
})();
</script>
{% endblock %}
